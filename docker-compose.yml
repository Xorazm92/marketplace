# Lokal ishlab chiqish uchun faqat PostgreSQL. Prod: docker-compose.prod.yml.
#   docker compose up -d
#   backend-main/.env: DATABASE_URL=postgresql://inbola:inbola@127.0.0.1:5432/inbola_dev
# E2E testlar uchun alohida baza: inbola_dev_test (nomi `_test` bilan tugashi shart).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inbola
      POSTGRES_PASSWORD: inbola
      POSTGRES_DB: inbola_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: [devdata:/var/lib/postgresql/data]

volumes:
  devdata:
