# Bu qadamlar lokal `bash scripts/verify-all.sh --docker` bilan bir xil: workflow o'zgarsa,
# skript ham o'zgarsin (GitHub Actions ishlamay qolganda yagona dalil — o'sha skript).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: inbola_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend-main/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.build.json
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Sxema va migratsiyalar mos (drift yo'q)
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/inbola_ci_test
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/inbola_ci_test
      - name: Ishlab chiqarish bog'liqliklarida critical yo'q
        run: npm audit --omit=dev --audit-level=critical

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  browser-e2e:
    needs: [backend, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: inbola_pw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Backend build
        working-directory: backend-main
        run: npm ci && npx prisma generate && npm run build
      - name: Web build
        working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: web
        run: npx playwright test
        env:
          E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/inbola_pw_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results
            web/.e2e/api.log

  guard-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .claude/hooks/guard-bash.test.sh .claude/hooks/guard-bash.sh
      - name: Skriptlar sintaksisi
        run: for f in scripts/*.sh .claude/hooks/*.sh; do bash -n "$f"; done
      - name: Repoda maxfiy fayl yo'q
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.example$' || true)
          [ -z "$bad" ] || { echo "Kuzatilayotgan env fayllar: $bad"; exit 1; }

  # Toza klondan image build: lokalda mavjud bo'lgan (repoda yo'q) fayllarga tayanib qolgan
  # Dockerfile shu yerda yiqiladi (web/Dockerfile bilan shunday bo'lgan).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inbola-backend ./backend-main
      - run: docker build -t inbola-web ./web
      - name: Compose fayli yaroqli
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet
      - name: Backend image secret'siz ishga tushmaydi
        run: |
          if docker run --rm -e DATABASE_URL=postgresql://x@localhost/x inbola-backend > out.log 2>&1; then
            echo "Secret'siz ishga tushdi"; exit 1
          fi
          grep -q "Config validation error" out.log
